[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "breplens"
version = "1.2.0"
description = "CAD-agnostic manufacturing feature recognition and parametric rebuild"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "BRepLens" }]
keywords = [
  "cad", "step", "brep", "feature-recognition", "machining",
  "manufacturing", "cnc", "opencascade", "ocp", "pytorch",
  "graph-neural-network", "streamlit", "fastapi", "nx-open",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "cadquery-ocp>=7.8,<7.10",
  "numpy>=1.26,<2.3",
  "networkx>=3.2,<4",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
ml = [
  "torch>=2.4",
  "torch-geometric>=2.5,<3",
]
service = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "python-multipart>=0.0.9",
  "redis>=5.0,<9",
  "sqlalchemy>=2.0,<3",
  "rq>=1.16,<3",
]
app = [
  "streamlit>=1.36,<2",
  "plotly>=5.20,<8",
  "trimesh>=4.0,<6",
]
dev = [
  "cadquery>=2.4,<3",
  "pytest>=8.0,<10",
  "pytest-cov>=5.0,<8",
  "mypy>=1.10,<2",
  "ruff>=0.5,<1",
  "psutil>=5.9,<8",
  "httpx>=0.27,<1",
  "hypothesis>=6.100,<7",
  "pre-commit>=3.7,<5",
]

[project.scripts]
breplens = "breplens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/breplens"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"src/breplens/geometry/synthetic.py" = ["E741"]
"tests/*" = ["B011"]
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["src/breplens"]
mypy_path = "src"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["src/breplens/adapters/nx\\.py", "src/breplens/adapters/nx_writeback\\.py"]

[[tool.mypy.overrides]]
module = ["OCP.*", "cadquery.*", "torch_geometric.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: long-running tests",
  "gpu: requires CUDA",
  "integration: cross-module integration tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["breplens"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
